<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Life – Simulation de carrière</title>
<style>
:root{--bg:#0b1a12;--card:#12281c;--card2:#183524;--line:#25503a;--txt:#eaf6ee;--mut:#8fb5a0;--acc:#2ee37a;--gold:#f5c542;--red:#ff6b6b;--blue:#4cc3ff}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at top,#14402a 0,#0b1a12 55%) fixed;color:var(--txt);min-height:100vh;line-height:1.45;overflow-anchor:none}
.wrap{max-width:1100px;margin:0 auto;padding:14px 12px 50px}
.top{text-align:center;margin-bottom:14px}
.top h1{font-size:1.9rem}
.sub{color:var(--mut)}
h2{margin-bottom:6px}
h3{margin:12px 0 6px;color:var(--mut);font-size:.9rem;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.2s}
.pcard:hover{transform:translateY(-3px);border-color:var(--acc)}
.pcard .fl{font-size:2.2rem}
.pcard h4{margin:4px 0 2px}
.pcard small{color:var(--mut);display:block}
.pt{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hud{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.id{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.id .flag{font-size:2.4rem}
.id p{color:var(--mut);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--card2);border-radius:10px;padding:7px 10px}
.stat.big b{display:block;font-size:1rem}
.stat.big span,.sl span{color:var(--mut);font-size:.75rem}
.sl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.bar{height:6px;background:#0b1a12;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.layout{display:grid;grid-template-columns:1fr 270px;gap:12px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
#main{min-height:520px}
.tag{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.8rem;margin-bottom:8px;color:var(--acc)}
.txt{font-size:1rem;margin:8px 0 12px}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.choice{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:.98rem;cursor:pointer;transition:.15s}
.choice:hover:not(:disabled){border-color:var(--acc);background:#1d4430}
.choice:disabled{opacity:.45;cursor:not-allowed}
.btn{background:var(--acc);color:#04210f;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.95rem;cursor:pointer;margin:3px 5px 3px 0}
.btn:hover{filter:brightness(1.1)}
.btn.small{padding:7px 12px;font-size:.85rem}
.btn.alt{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border-radius:99px;padding:3px 11px;font-size:.82rem;font-weight:600;background:var(--card2)}
.chip.up{color:var(--acc);border:1px solid var(--acc)}
.chip.down{color:var(--red);border:1px solid var(--red)}
.offers{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.offer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.offer small{color:var(--mut)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.opt{background:var(--card2);color:var(--txt);border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.opt.sel{border-color:var(--gold);background:#2a3a1c}
.opt small{color:var(--mut)}
table{width:100%;border-collapse:collapse;margin:8px 0 12px}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:600}
#log{list-style:none;font-size:.85rem;color:var(--mut)}
#log li{padding:6px 0;border-bottom:1px solid var(--line)}
.big-title{font-size:1.7rem;color:var(--gold);margin:6px 0}
.board{display:flex;align-items:center;justify-content:space-around;gap:10px;background:linear-gradient(135deg,#0e3b22,#14522f);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;text-align:center}
.board span{font-size:1.8rem;display:block}
.board small{color:var(--mut);display:block;font-size:.82rem}
.board .sc{font-size:2rem;font-weight:800;color:var(--gold);letter-spacing:2px}
.mstat{color:var(--mut);font-size:.85rem;margin-bottom:8px}
.ln{padding:7px 11px;margin-bottom:6px;border-left:3px solid var(--line);background:var(--card2);border-radius:0 10px 10px 0;font-size:.95rem}
.ln.goal{border-left-color:var(--acc)}
.ln.bad{border-left-color:var(--red)}
.ln.sys{border-left-color:var(--gold)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;overflow:auto;padding:14px 8px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:920px;margin:0 auto;padding:14px}
.mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tb{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:.82rem}
.tb.on{background:var(--acc);color:#04210f;font-weight:700}
table.lt{font-size:.85rem;margin:4px 0 10px}
.lt th{color:var(--mut);text-align:right;padding:4px 3px;border-bottom:1px solid var(--line)}
.lt td{padding:4px 3px;text-align:right;font-weight:400}
.lt td:nth-child(2),.lt th:nth-child(2){text-align:left}
.lt tr.me{background:#1d4430;font-weight:700}
.lt tr.z-m td:first-child{border-left:4px solid var(--acc)}
.lt tr.z-s td:first-child{border-left:4px solid var(--blue)}
.lt tr.z-t td:first-child{border-left:4px solid var(--gold)}
.lt tr.z-rel td:first-child{border-left:4px solid var(--red)}
.lt tr.z-pro td:first-child{border-left:4px solid var(--acc)}
select,input[type=text]{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.95rem;margin:0 6px 6px 0}
.form{display:flex;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>⚽ Football Life</h1>
    <p class="sub">Mène un jeune talent jusqu'au sommet : clubs, coupes, sélection, argent, famille, réseaux.</p>
  </header>

  <section id="start">
    <h2>Choisis ton joueur</h2>
    <div id="resume"></div>
    <div id="players" class="grid"></div>
    <div class="card" style="margin-top:16px">
      <h2>✨ Créer mon joueur</h2>
      <div class="form">
        <input id="cn" type="text" placeholder="Nom du joueur" maxlength="30">
        <select id="cnat"></select>
        <select id="cpos"><option value="att">Attaquant</option><option value="ail">Ailier</option><option value="mil">Milieu</option><option value="def">Défenseur</option></select>
        <button class="btn" onclick="createPlayer()">Créer et jouer</button>
      </div>
      <p class="mstat">Ton joueur débute en 2e division du pays de sa nationalité (ou d'un pays de son continent).</p>
    </div>
  </section>

  <section id="game" hidden>
    <div class="nav">
      <button class="btn small ghost" onclick="openTab('lg')">📊 Classements</button>
      <button class="btn small ghost" onclick="openTab('wd')">🗺️ Championnats du monde</button>
      <button class="btn small ghost" onclick="openTab('fin')">💰 Finances</button>
      <button class="btn small ghost" onclick="openTab('soc')">📱 Réseaux & sponsors</button>
      <button class="btn small ghost" onclick="openTab('vie')">💞 Vie privée</button>
      <button class="btn small ghost" onclick="openTab('pal')">🏅 Palmarès</button>
      <button class="btn small ghost" onclick="openTab('mer')">🔄 Mercato mondial</button>
    </div>
    <div class="hud" id="hud"></div>
    <div class="layout">
      <div class="card" id="main"></div>
      <aside class="card"><h3 style="margin-top:0">Journal</h3><ul id="log"></ul></aside>
    </div>
  </section>
</div>
<div id="modal" hidden></div>

function poisson(mu,rg=Math.random){const L=Math.exp(-mu);let k=0,p=1;do{k++;p*=rg()}while(p>L&&k<14);return k-1}
function simPair(la,lb,rg=Math.random){return[poisson(1.3*Math.exp((la-lb)/28),rg),poisson(1.0*Math.exp((lb-la)/28),rg)]}
function simKO(la,lb){let[a,b]=simPair(la,lb),et=false,pen=false;
  if(a===b){et=true;a+=poisson(.45*Math.exp((la-lb)/28));b+=poisson(.35*Math.exp((lb-la)/28))}
  if(a===b){pen=true;if(Math.random()<.5+(la-lb)/300)a++;else b++}

const WORLD={},RANK={};
CT.forEach(([id,n,f,k,d1n,d2n,t,b,cl])=>{
  const[A,B]=cl.split(";").map(x=>x.split(",")),clubs=[];
  A.forEach((nm,i)=>{const l=Math.round(b+(t-b)*Math.pow((A.length-1-i)/(A.length-1),1.4)+(mulberry(hash(id+nm))()-.5)*3);clubs.push({n:nm,c:id,d:1,l0:l,l})});
  B.forEach((nm,j)=>{const l=Math.round(b-2-(j/(B.length-1))*10+(mulberry(hash(id+nm))()-.5)*3);clubs.push({n:nm,c:id,d:2,l0:l,l})});
  WORLD[id]={id,n,f,k,d1n,d2n,t,b,clubs};
});
Object.values(WORLD).forEach(w=>{RANK[w.id]=Object.values(WORLD).filter(x=>x.k===w.k&&x.t>w.t).length});

function slots(id){const k=WORLD[id].k,r=RANK[id];
  if(k==="EU")return r<5?{m:4,s:2,t:1}:r<9?{m:2,s:1,t:1}:{m:1,s:1,t:1};
  if(k==="AF")return r<4?{m:2,s:2}:{m:1,s:1};
  if(k==="AMS")return r<2?{m:4,s:3}:{m:2,s:2};
  if(k==="AMN")return{m:2};
  if(k==="AS")return r<3?{m:2,s:2}:{m:1,s:1};
  return{m:1}}

/* ================= SIMULATION CHAMPIONNAT ================= */
function schedule(n){
  const ids=[...Array(n).keys()],rounds=[];
  for(let r=0;r<n-1;r++){const f=[];for(let i=0;i<n/2;i++){const a=ids[i],b=ids[n-1-i];f.push(r%2?[b,a]:[a,b])}rounds.push(f);ids.splice(1,0,ids.pop())}
  return[...rounds,...rounds.map(r=>r.map(([a,b])=>[b,a]))]}
const sortT=ts=>[...ts].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.n.localeCompare(b.n));
function addRes(x,y,gx,gy){x.gf+=gx;x.ga+=gy;y.gf+=gy;y.ga+=gx;
  if(gx>gy){x.w++;x.pts+=3;y.lo++}else if(gx<gy){y.w++;y.pts+=3;x.lo++}else{x.d++;y.d++;x.pts++;y.pts++}x.p++;y.p++}
const blank=c=>({n:c.n,l:c.l,p:0,w:0,d:0,lo:0,gf:0,ga:0,pts:0});
const myEff=()=>G.club.l+clamp((G.ovr-G.club.l)/8,-3,6);
const lvOf=t=>t.me?t.l+clamp((G.ovr-t.l)/8,-3,6):t.l;
function newLeague(cid,d,me){
  const teams=shuffle(leagueClubs(cid,d)).map(blank);

function autoStats(gf){
  if(G.banned)return;
  const pt=clamp((G.ovr-(G.club.l-12))/12,.2,1),gpm=Math.max(0,(G.ovr-40)/50)*GOALF[G.pos]/32*pt;
  const g=Math.min(gf,poisson(gpm)),a=Math.min(gf-g,poisson(gpm*.5));addStats(g,a)}
function applyRound(lg,r,mine){
  lg.rounds[r-1].forEach(([a,b])=>{
    const A=lg.teams[a],B=lg.teams[b];let ga,gb;
    if(a===lg.me||b===lg.me){
      if(mine){ga=a===lg.me?mine.my:mine.op;gb=a===lg.me?mine.op:mine.my}
      else{const e=myEff();const s=simPair(a===lg.me?e:A.l,b===lg.me?e:B.l);ga=s[0];gb=s[1];autoStats(a===lg.me?ga:gb)}
    }else{const s=simPair(A.l,B.l);ga=s[0];gb=s[1]}
    addRes(A,B,ga,gb)});
  lg.md=r}
function lgSimTo(m){const lg=G.lg;for(let r=lg.md+1;r<=m;r++)applyRound(lg,r,null)}
function seededTable(cid,d,md,seed){
  const cl=leagueClubs(cid,d).map(blank),rg=mulberry(seed),rounds=schedule(cl.length);
  const m=md==null?rounds.length:Math.min(md,rounds.length);
  for(let r=0;r<m;r++)rounds[r].forEach(([a,b])=>{const s=simPair(cl[a].l,cl[b].l,rg);addRes(cl[a],cl[b],s[0],s[1])});
  return sortT(cl)}

/* ================= COMPÉTITIONS (coupe, continental, sélection) ================= */
const rname=n=>({16:"Huitièmes de finale",8:"Quarts de finale",4:"Demi-finales",2:"Finale"})[n];
function newComp(name,teams,o){
  const C={name,w:o.w||3,nat:!!o.nat,dbl:!!o.dbl,teams:teams.map(t=>({n:t.n,l:t.l,f:t.f,me:!!t.me,p:0,w:0,d:0,lo:0,gf:0,ga:0,pts:0})),
    log:[],r:0,gr:0,done:false,won:false,out:null,groups:null,cur:null,stage:"KO",alive:teams.some(t=>t.me)};
  const idx=shuffle(C.teams.map((_,i)=>i));
  if(o.groups){C.stage="G";C.groups=[];for(let i=0;i<idx.length;i+=4)C.groups.push(idx.slice(i,i+4));
    C.sched=schedule(4);if(!C.dbl)C.sched=C.sched.slice(0,3)}
  else C.cur=idx;

function groupRound(C,r,mine){
  const meI=C.teams.findIndex(t=>t.me);
  C.groups.forEach(gr=>C.sched[r].forEach(([a,b])=>{
    const x=C.teams[gr[a]],y=C.teams[gr[b]],isMe=gr[a]===meI||gr[b]===meI;let ga,gb;
    if(mine&&isMe){ga=gr[a]===meI?mine.my:mine.op;gb=gr[a]===meI?mine.op:mine.my}
    else{const s=simPair(lvOf(x),lvOf(y));ga=s[0];gb=s[1]}
    addRes(x,y,ga,gb);
    if(isMe)C.log.push(`Groupe · J${r+1} : ${x.n} ${ga}-${gb} ${y.n}`)}))}
function endGroups(C){
  const q=C.groups.map(gr=>sortT(gr.map(i=>C.teams[i])).slice(0,2).map(t=>C.teams.indexOf(t))),cur=[];
  if(q.length===1)cur.push(q[0][0],q[0][1]);
  else for(let g=0;g<q.length;g+=2)cur.push(q[g][0],q[g+1][1],q[g+1][0],q[g][1]);
  C.cur=cur;C.r=0;C.stage="KO";
  if(C.alive&&!cur.some(i=>C.teams[i].me)){C.alive=false;C.out="Phase de groupes"}}
function koRound(C,mine){
  const rn=rname(C.cur.length),nx=[];
  for(let i=0;i<C.cur.length;i+=2){
    const A=C.teams[C.cur[i]],B=C.teams[C.cur[i+1]];let w,sc;
    if(mine&&(A.me||B.me)){const ga=A.me?mine.my:mine.op,gb=A.me?mine.op:mine.my;w=mine.win?(A.me?A:B):(A.me?B:A);sc=`${ga}-${gb}`+(mine.pk?" (t.a.b.)":mine.et?" (a.p.)":"")}
    else{const r=simKO(lvOf(A),lvOf(B));w=r.a>r.b?A:B;sc=`${r.a}-${r.b}`+(r.pen?" (t.a.b.)":r.et?" (a.p.)":"")}
    C.log.push(`${rn} : ${A.n} ${sc} ${B.n} → ${w.n}`);
    if((A.me||B.me)&&!w.me&&C.alive){C.alive=false;C.out=rn}
    nx.push(C.teams.indexOf(w))}
  C.cur=nx;C.r++;
  if(nx.length===1){C.done=true;if(C.teams[nx[0]].me)C.won=true}}
function compFinish(C){
  if(!C)return;
  while(C.stage==="G"&&C.gr<C.sched.length){groupRound(C,C.gr,null);C.gr++}
  if(C.stage==="G")endGroups(C);

    const r=C.gr,g=C.groups.findIndex(x=>x.includes(meI)),gr=C.groups[g];
    const fx=C.sched[r].find(([a,b])=>gr[a]===meI||gr[b]===meI),oi=gr[fx[0]]===meI?gr[fx[1]]:gr[fx[0]];

      onEnd:res=>{groupRound(C,r,res);C.gr++;let t="Classement du groupe mis à jour.";
        if(C.gr>=C.sched.length){endGroups(C);t=C.alive?`✅ Qualifié pour les ${rname(C.cur.length)} !`:"❌ Éliminé en phase de groupes"}
        return `<div class="ln sys">${t}</div>`}});
  }else{
    const p=C.cur.indexOf(meI),A=C.teams[C.cur[p-(p%2)]],B=C.teams[C.cur[p-(p%2)+1]],m=A.me?A:B,o=A.me?B:A,rn=rname(C.cur.length);
    offerMatch({title:`${C.name} · ${rn}`,myN:m.n,myF:m.f,myL:m.l,opN:o.n,opF:o.f,opL:o.l,big:C.cur.length<=4,ko:true,nat:C.nat,

function takePenalty(style){
  const ok=Math.random()<clamp([.72,.78,.55][style]+pf()+pw()/3,.3,.9);
  M.rating=clamp(M.rating+(ok?.5:-.8),3,10);if(style===2&&ok)G.rep=clamp(G.rep+2);
  const pa=clamp(.76+tm()/2,.55,.88),pb=clamp(.76-tm()/2,.55,.88),A=[],B=[];
  for(let k=0;k<5;k++){A.push(k===2?ok:Math.random()<pa);B.push(Math.random()<pb)}

  while(sa===sb&&g++<30){const x=Math.random()<pa,y=Math.random()<pb;A.push(x);B.push(y);sa+=x?1:0;sb+=y?1:0}

function buildQueue(N){
  const q=[],plan={},add=(f,tk)=>{const w=clamp(Math.round(N*f),1,N);(plan[w]=plan[w]||[]).push(tk)};

  add(.5,"TR");
  for(let w=1;w<=N;w++){q.push("LG:"+w);(plan[w]||[]).forEach(t=>q.push(t))}
  for(let i=0;i<6;i++)q.push("C:nt");

  const wc=WORLD[G.club.c].clubs.find(x=>x.n===G.club.n);if(wc){G.club.l=wc.l;G.club.d=divOf(wc)}
  G.lg=newLeague(G.club.c,G.club.d,G.club);G.cup=buildCup();G.ct=G.cont?buildCont(G.cont):null;setupNT();
  G.sGoals=0;G.sAssists=0;G.sTitles=[];G.sPts=0;G.act=3;G.auto=false;G.autoLog=[];G.msg="";
  let el=EVENTS.filter(e=>(!e.cond||e.cond(G))&&!G.seen.includes(e.id));

  G.evs=shuffle(el).slice(0,6).map(e=>e.id);G.seen=[...G.seen,...G.evs].slice(-14);

function makeOffers(forced){

  const all=Object.values(WORLD).flatMap(w=>w.clubs.map(c=>({n:c.n,l:c.l,c:c.c,d:divOf(c)})));
  let pool=all.filter(c=>!(c.n===G.club.n&&c.c===G.club.c)).sort((a,b)=>Math.abs(a.l-tgt)-Math.abs(b.l-tgt)).slice(0,10);
  pool=shuffle(pool).slice(0,3);
  const arr=[...(!forced&&G.pres>=25?[{club:G.club,renew:true}]:[]),...pool.map(c=>({club:c}))];
  G.offers=arr.map(o=>{o.sal=Math.round(salaryFor(G.ovr,o.club)*(forced?.7:1)/1000)*1000;o.bonus=Math.round(o.sal*(o.renew?.15:.35)/1000)*1000;return o})}
function transferWindow(){makeOffers(false);renderOffers()}
function forcedMarket(){makeOffers(true);renderOffers()}
function renderOffers(){
  let h=`<span class="tag">💼 Mercato</span><h2>${G.forced?"Ton contrat est résilié : trouve un nouveau club !":`Saison ${G.season} · Offres reçues`}</h2>
  <p class="txt">${G.forced?"Aucun club ne te garde : choisis parmi ces propositions.":"Signe tout de suite ou négocie. Un transfert prend effet à la fin de la saison."}</p><div class="offers">`;
  G.offers.forEach((o,i)=>{const w=WORLD[o.club.c];
    h+=`<div class="offer"><div><b>${w.f} ${o.club.n}</b> ${o.renew?'<span class="pill">Prolongation</span>':""}<br><small>${w.n} · ${divOf(o.club)===1?w.d1n:w.d2n} · niveau ${o.club.l} · <b>${fmt(o.sal)}</b>/an · prime ${fmt(o.bonus)}</small></div>
    <div><button class="btn small" onclick="accept(${i},0,'')">Signer</button><button class="btn small alt" onclick="openNego(${i})">Négocier</button></div></div>`});
  h+=`</div>${G.forced?"":`<button class="btn ghost" onclick="skipMarket()">Ne rien signer et continuer la saison</button>`}`;
  setMain(h)}
function skipMarket(){G.offers=[];nextStep()}
function accept(i,comm,pref){
  const o=G.offers[i],b=snap();G.money+=o.bonus-comm;let m;
  if(o.renew){G.salary=o.sal;m=`Tu prolonges à ${o.club.n} avec un salaire de ${fmt(o.sal)} par an.`;G.form=clamp(G.form+2);G.pres=clamp(G.pres+5)}
  else{G.next={club:{n:o.club.n,l:o.club.l,c:o.club.c},sal:o.sal};m=`Accord avec ${o.club.n} (${WORLD[o.club.c].n}) : ${fmt(o.sal)}/an. Tu les rejoindras en fin de saison.`;G.form=clamp(G.form+3)}
  if(comm)m+=` Ton agent prélève ${fmt(comm)}.`;
  addLog(m);const a=snap();G.offers=[];
  setMain(`<div><button class="btn" id="go">Continuer</button></div><p class="txt">${pref+m}</p><div class="chips">${chips(b,a)}</div>`);
  $("#go").onclick=G.forced?()=>{applyNext();G.forced=false;G.banned=false;beginSeason()}:nextStep;render()}
const AGENTS=[{n:"Agent débutant",c:.03,s:0,d:"Peu cher, peu influent"},{n:"Agent expérimenté",c:.06,s:.08,d:"Bon carnet d'adresses"},{n:"Super-agent",c:.10,s:.16,d:"Redoutable négociateur"}];
const DEMANDS=[{l:"+10 %",v:.10},{l:"+25 %",v:.25},{l:"+50 %",v:.50},{l:"+100 % (folie)",v:1}];
function negoP(){const o=G.offers[NEGO.i];return clamp(.92-DEMANDS[NEGO.d].v*.9+AGENTS[NEGO.a].s+(G.rep-50)/400+(G.ovr-o.club.l)/120,.05,.95)}
function openNego(i){NEGO={i,a:1,d:1};renderNego()}
function renderNego(){
  const o=G.offers[NEGO.i],p=negoP(),lab=p>.75?"Élevées":p>.5?"Correctes":p>.25?"Faibles":"Quasi nulles";
  let h=`<span class="tag">🤝 Négociation</span><div><button class="btn" onclick="doNego()">Lancer la négociation</button><button class="btn ghost" onclick="renderOffers()">Retour</button></div>
  <h2>${WORLD[o.club.c].f} ${o.club.n}</h2><p class="txt">Offre : <b>${fmt(o.sal)}</b>/an. Plus tu demandes, plus le club risque de se retirer. Chances : <b>${lab}</b></p><h3>Ton agent</h3><div class="opts">`;
  AGENTS.forEach((a,k)=>h+=`<button class="opt ${NEGO.a===k?"sel":""}" onclick="NEGO.a=${k};renderNego()"><b>${a.n}</b><br><small>${a.d} · commission ${Math.round(a.c*100)} %</small></button>`);
  h+=`</div><h3>Ta demande</h3><div class="opts">`;
  DEMANDS.forEach((d,k)=>h+=`<button class="opt ${NEGO.d===k?"sel":""}" onclick="NEGO.d=${k};renderNego()"><b>${d.l}</b><br><small>${fmt(o.sal*(1+d.v))}/an</small></button>`);
  setMain(h+"</div>")}
function doNego(){
  const o=G.offers[NEGO.i],a=AGENTS[NEGO.a],d=DEMANDS[NEGO.d];
  if(Math.random()<negoP()){o.sal=Math.round(o.sal*(1+d.v)/1000)*1000;o.bonus=Math.round(o.sal*(o.renew?.15:.35)/1000)*1000;accept(NEGO.i,Math.round(o.sal*a.c),"🤝 Négociation réussie ! ")}
  else{const nom=o.club.n;G.offers.splice(NEGO.i,1);G.rep=clamp(G.rep-1);addLog(`${nom} retire son offre.`);
    setMain(`<div><button class="btn" id="go">Continuer</button></div><p class="txt">${nom} juge tes exigences excessives et retire son offre.</p>`);
    $("#go").onclick=()=>G.offers.length?renderOffers():(G.forced?forcedMarket():skipMarket())}}
function applyNext(){
  if(!G.next)return;
  const nc=WORLD[G.next.club.c].clubs.find(x=>x.n===G.next.club.n),old=G.club;
  if(nc.c!==old.c){G.fam=clamp(G.fam-4);if(G.partner)G.couple=clamp(G.couple-5)}
  G.club={n:nc.n,l:nc.l,c:nc.c,d:divOf(nc)};G.salary=G.next.sal;G.form=clamp(G.form+6);G.rep=clamp(G.rep+Math.max(0,nc.l-old.l)/4);
  G.coach=60;G.pres=60;addLog(`Nouveau club : ${nc.n}.`);G.next=null}
function nextSeason(){if(G.forced)return forcedMarket();applyNext();beginSeason()}

/* mercato des autres clubs + évolution des niveaux */
function aiMercato(){
  const all=Object.values(WORLD).flatMap(w=>w.clubs),news=[];
  all.forEach(c=>{const k=c.c+":"+c.n,off=clamp((G.off[k]||0)*.7+rnd(-2,2),-6,6);G.off[k]=Math.round(off*10)/10;c.l=clamp(Math.round(c.l0+off),30,93)});
  const top=all.filter(c=>divOf(c)===1).sort((a,b)=>b.l-a.l).slice(0,30);
  for(let i=0;i<8;i++){
    const buy=pick(top),sell=pick(all.filter(c=>c.n!==buy.n&&divOf(c)===1&&c.l<buy.l&&c.l>buy.l-18));if(!sell)continue;
    const star=pick(FN)+" "+pick(LN),fee=ri(15,150);
    buy.l=Math.min(93,buy.l+1);sell.l=Math.max(30,sell.l-1);
    G.off[buy.c+":"+buy.n]=(G.off[buy.c+":"+buy.n]||0)+1;G.off[sell.c+":"+sell.n]=(G.off[sell.c+":"+sell.n]||0)-1;
    news.push(`${star} quitte ${WORLD[sell.c].f} ${sell.n} pour ${WORLD[buy.c].f} ${buy.n} (${fee} M€)`)}
  G.news=[...news.map(x=>`Saison ${G.season} · ${x}`),...G.news].slice(0,30)}

/* ================= FIN DE SAISON ================= */
function endSeason(){
  const s=G.season,c=G.club,w=WORLD[c.c],lg=G.lg,b=snap(),ov0=Math.round(G.ovr),extra=[];
  lgSimTo(lg.N);[G.cup,G.ct,G.nt].forEach(compFinish);
  const sorted=sortT(lg.teams),rank=sorted.findIndex(t=>t.n===c.n)+1,nT=sorted.length,mt=lg.teams[lg.me],lgName=lg.d===1?w.d1n:w.d2n;
  const pt=G.banned?.2:clamp((G.ovr-(c.l-12))/12,.2,1);
  /* finances */
  const net=G.salary*.55,cost=40000+G.salary*.05*(1+G.kids*.3+(G.partner?.3:0));let fin=net-cost;
  G.spons=G.spons.filter(sp=>{if(G.img<25&&Math.random()<.5){extra.push(`📉 ${sp.b} rompt son contrat (image dégradée).`);return false}
    fin+=sp.amt;sp.yrs--;return sp.yrs>0});
  const soc=Math.round((G.ig+G.tk)*150);fin+=soc;
  G.inv.forEach(i=>{const x=INV.find(v=>v.k===i.k),m=x.f(),v=Math.round(i.amt*m);fin+=v;
    extra.push(`${m>=1?"📈":"📉"} ${x.n} : ${fmt(i.amt)} → ${fmt(v)}`);if(i.k==="acad"&&m>1)G.rep=clamp(G.rep+2)});
  G.inv=[];G.assets.forEach(a=>{a.v=Math.round(a.v*(1+a.g))});G.money+=fin;
  /* titres */
  if(rank===1){trophy(lgName,lg.d===1?5:3);extra.push(`🏆 Champion de ${lgName} !`)}
  /* promotions / relégations dans le pays */
  const seed=d=>hash(c.c+":"+d+":"+s);let up=[],down=[];
  if(lg.d===1){down=sorted.slice(-2).map(t=>t.n);up=seededTable(c.c,2,null,seed(2)).slice(0,2).map(t=>t.n)}
  else{up=sorted.slice(0,2).map(t=>t.n);down=seededTable(c.c,1,null,seed(1)).slice(-2).map(t=>t.n)}
  up.forEach(n=>G.div[c.c+":"+n]=1);down.forEach(n=>G.div[c.c+":"+n]=2);
  if(up.includes(c.n)){G.club={...c,d:1};extra.push(`⬆️ Promotion en ${w.d1n} !`)}
  if(down.includes(c.n)){G.club={...c,d:2};extra.push(`⬇️ Relégation en ${w.d2n}…`)}
  /* qualification continentale */
  let qual=null;
  if(lg.d===1){const sl=slots(c.c);if(rank<=sl.m)qual="m";else if(sl.s&&rank<=sl.m+sl.s)qual="s";else if(sl.t&&rank<=sl.m+sl.s+sl.t)qual="t"}
  if(G.cup.won&&(!qual||qual==="t")&&COMPS[w.k].s)qual="s";
  G.cont=qual;if(qual)extra.push(`🌍 Qualifié pour ${COMPS[w.k][qual]} la saison prochaine !`);
  /* relations */
  if(!G.banned){const good=rank<=Math.ceil(nT/3),bad=rank>nT*2/3;G.coach=clamp(G.coach+(good?6:bad?-6:0));G.pres=clamp(G.pres+(good?6:bad?-6:0))}
  /* distinctions */
  const goals=G.sGoals,assists=G.sAssists,ps=G.ovr+goals*.3+assists*.15+G.sPts*.8+(c.d===1?0:-6),riv=()=>Math.max(...[1,2,3,4,5].map(()=>rnd(80,94))),aw=[];
  if(G.ovr>=80&&G.rep>=70&&ps>riv()){G.aw.bd++;aw.push("🥇 Ballon d'Or")}
  if(G.ovr>=78&&G.rep>=65&&ps+rnd(-2,2)>riv()){G.aw.tb++;aw.push("⭐ FIFA The Best")}
  if(w.k==="EU"&&lg.d===1&&goals*(RANK[c.c]<5?2:RANK[c.c]<9?1.5:1)>rnd(58,82)){G.aw.sd++;aw.push("👟 Soulier d'Or")}
  if(G.age<=21&&G.ovr>=72&&ps>rnd(76,88)){G.aw.kopa++;aw.push("🌟 Trophée du meilleur jeune (Kopa)")}
  if(G.age<=21&&w.k==="EU"&&G.ovr>=70&&ps>rnd(74,86)){G.aw.gb++;aw.push("🏆 Golden Boy")}
  if(G.age<=23&&ps>rnd(65,80)){G.aw.yp++;aw.push("🌱 Meilleur jeune du championnat")}
  aw.forEach(x=>{G.rep=clamp(G.rep+3);extra.push(x)});
  /* progression */
  const base=G.age<=20?3.2:G.age<=23?2.2:G.age<=27?.8:G.age<=30?-.3:G.age<=33?-1.5:-2.5;
  let d=base*(.6+.4*pt)+(G.form-55)/50+rnd(-.7,.7)+clamp((c.l-G.ovr)/25,-.5,1);if(G.ovr>=G.pot&&d>0)d*=.3;
  G.ovr=clamp(G.ovr+d,40,99);G.peak=Math.max(G.peak,Math.round(G.ovr));
  const tgt=clamp(G.ovr+goals/3+G.sTitles.length*5+aw.length*4-6,0,100);G.rep=clamp(G.rep+(tgt-G.rep)*.3);
  G.form=clamp(G.form+(70-G.form)*.5);if(G.partner)G.couple=clamp(G.couple-3);G.fam=clamp(G.fam-2);
  G.ig+=Math.round((G.rep*rnd(3,8)+goals*4+G.sTitles.length*60)*(G.img/60));G.tk+=Math.round((G.rep*rnd(3,9)+goals*4+G.sTitles.length*50)*(G.img/60));
  G.img=clamp(G.img+(60-G.img)*.2+(G.sTitles.length?4:0));
  if(!G.summit&&Math.round(G.ovr)>=90&&G.rep>=90){G.summit=true;extra.push("🏔️ Tu as atteint le sommet du football mondial !")}
  if(G.secret>0&&Math.random()<clamp(.2+.2*G.secret,0,.8)){scandal();extra.push("💥 La presse révèle ton infidélité !")}
  checkOut();
  aiMercato();
  G.age++;G.season++;G.act=3;
  G.hist.push(`Saison ${s} (${c.n}) : ${rank}e en ${lgName}, ${goals} buts${G.sTitles.length?", "+G.sTitles.join(", "):""}`);
  addLog(`Fin de saison : ${rank}e, ${goals} buts, ${G.sTitles.length} titre(s).`);
  const a=snap(),fi=G.form<=0||G.money<-2e6||G.ovr<=46||G.age>=39;
  const ntRow=G.nt?`<tr><td>${G.nt.name}</td><td>${G.ntInfo}${G.nt.alive||G.nt.won||G.nt.out?" · "+cres(G.nt):""}</td></tr>`:"";
  let h=`<span class="tag">📅 Bilan</span><div>${fi?`<button class="btn" onclick="finish(G.form<=0?'blessure':G.money<-2e6?'ruine':'retraite')">Voir ma fin de carrière</button>`:`<button class="btn" onclick="nextSeason()">Saison suivante ▶</button>${G.age>=33?`<button class="btn ghost" onclick="finish('retraite')">Prendre ma retraite</button>`:""}`}</div>
  <h2>Fin de la saison ${s}</h2>
  <table><tr><td>Club</td><td>${w.f} ${c.n}</td></tr>
  <tr><td>${lgName}</td><td>${rank}e / ${nT} · ${mt.pts} pts (${mt.w}V ${mt.d}N ${mt.lo}D)</td></tr>
  <tr><td>${G.cup.name}</td><td>${cres(G.cup)}</td></tr>
  <tr><td>Compétition continentale</td><td>${G.ct?G.ct.name+" : "+cres(G.ct):"Non qualifié"}</td></tr>${ntRow}
  <tr><td>Buts / passes décisives</td><td>${goals} / ${assists}</td></tr>
  <tr><td>Niveau</td><td>${ov0} → ${Math.round(G.ovr)}</td></tr>
  <tr><td>Revenus nets (salaire, sponsors, réseaux)</td><td>${fmt(fin)}</td></tr></table>
  ${extra.map(x=>`<div class="ln sys">${x}</div>`).join("")}<div class="chips">${chips(b,a)}</div>`;
  setMain(h);render();
}

function finish(reason){
  try{localStorage.removeItem("fl_save2")}catch(e){}
  const nw=netWorth(),score=Math.round(G.peak*3+G.trophies*6+G.aw.bd*35+G.aw.tb*20+G.aw.sd*15+G.aw.kopa*5+G.aw.gb*5+G.rep+G.fam/2+(G.partner?G.couple/2:0)+Math.max(0,nw)/2e6);
  const v=score>=650?"Légende absolue 👑":score>=480?"Superstar mondiale ⭐":score>=350?"Grand joueur 🔥":score>=250?"Bonne carrière 👍":"Carrière modeste";
  const mo={retraite:"Tu raccroches les crampons.",blessure:"Une blessure met brutalement fin à ta carrière.",ruine:"Tes dettes t'obligent à tout arrêter."}[reason];
  setMain(`<span class="tag">🏁 Fin de carrière</span><div><button class="btn" onclick="location.reload()">Rejouer</button></div><h2>${G.name} ${G.flag}</h2><p class="txt">${mo}</p><p class="big-title">${v}</p>

 {t:"🎉 Organiser une soirée entre amis",c:g=>1,run:()=>[{sal:-.02,form:-3,img:1},"Une bonne soirée sans histoire."]},
 {t:"🍾 Organiser une grosse soirée VIP",c:g=>1,run:()=>Math.random()<.7?[{sal:-.05,rep:2,img:3,form:-6},"Soirée incroyable, ton réseau s'agrandit !"]:[{sal:-.05,img:-14,rep:-3,form:-6,coach:-6},"Des vidéos de la soirée fuitent : bad buzz !"]},
 {t:"💋 Soirée VIP… et tromper ta partenaire (très risqué)",c:g=>g.partner,run:()=>Math.random()<.2?[{form:-4,secret:1,scandal:1},"Un paparazzi te photographie : c'est le scandale !"]:[{form:-4,secret:1},"Personne ne t'a vu… pour l'instant. Si ça se sait, les conséquences seront terribles."]}
];
const SOC=[
 {t:"📸 Poster une photo sur Instagram",run:()=>[{ig:Math.round(rnd(3,10)+G.rep/3),img:1},"Ta photo plaît à tes abonnés."]},
 {t:"🎵 Tenter une vidéo TikTok virale",run:()=>Math.random()<.5?[{tk:Math.round(rnd(40,160)+G.rep),img:3},"La vidéo devient virale !"]:[{tk:ri(1,8)},"La vidéo fait un flop."]},
 {t:"🎤 Faire un live avec les fans",run:()=>[{ig:ri(5,15),tk:ri(5,15),img:3,form:-1},"Les fans adorent ce moment de proximité."]},
 {t:"🔥 Clash avec un rival sur les réseaux",run:()=>Math.random()<.5?[{ig:ri(30,100),tk:ri(30,100),img:-5,rep:1},"Le clash fait le buzz : beaucoup d'abonnés en plus !"]:[{img:-16,rep:-4,ig:-20},"Le clash tourne mal : bad buzz et abonnés perdus."]},
 {t:"🤝 Publier un post sponsorisé",run:()=>[{money:Math.round((G.ig+G.tk)*15),img:-1},"Un joli cachet pour un post."]}
];
function doAct(kind,i){
  const A=(kind==="vie"?ACTS:SOC)[i];
  if(G.act<=0){G.msg="Plus d'actions disponibles cette saison.";return renderModal()}
  G.act--;const r=A.run();applyFx(r[0]);G.msg=r[1];addLog(r[1]);checkOut();render();renderModal()}
const shopCost=c=>Math.round(Math.max(c*G.salary,c*150000)/1000)*1000;
function buy(id){
  const s=SHOP.find(x=>x.id===id),cost=shopCost(s.c);
  if(G.money<cost){G.msg="Tu n'as pas assez d'argent.";return renderModal()}
  G.money-=cost;applyFx(s.fx);if(s.as)G.assets.push({n:s.as[0],v:cost*.9,g:s.as[1]});
  G.msg=`Achat : ${s.n} (${fmt(cost)}).`;addLog(G.msg);checkOut();render();renderModal()}
function invest(k,p){
  const amt=Math.round(G.money*p/1000)*1000;
  if(amt<=0){G.msg="Tu n'as pas assez d'argent.";return renderModal()}
  G.money-=amt;G.inv.push({k,amt});G.msg=`Tu investis ${fmt(amt)} dans « ${INV.find(x=>x.k===k).n} ». Résultat en fin de saison.`;addLog(G.msg);render();renderModal()}
const TAB={
 lg:()=>{const lg=G.lg,w=WORLD[G.club.c];return `<h3>${w.f} ${lg.d===1?w.d1n:w.d2n} · Journée ${lg.md}/${lg.N}</h3>${tblHTML(sortT(lg.teams),zoneFn(G.club.c,lg.d,lg.teams.length),G.club.n)}<p class="mstat">Barre verte : compétition continentale principale · bleue : secondaire · jaune : 3e compétition · rouge : relégation · verte (2e division) : promotion</p>
  <h3>Coupe nationale</h3>${compHTML(G.cup,"")}`},
 cup:()=>compHTML(G.cup,"Pas de coupe."),
 ct:()=>G.ct?compHTML(G.ct,""):(()=>{const sl=slots(G.club.c),cm=COMPS[WORLD[G.club.c].k];return `<p class="txt">Tu n'es pas qualifié cette saison. Dans ton championnat (1re division) : ${sl.m} place(s) en ${cm.m}${sl.s?`, ${sl.s} en ${cm.s}`:""}${sl.t?`, ${sl.t} en ${cm.t}`:""}. Le vainqueur de la coupe nationale accède à ${cm.s||cm.m}.</p>`})(),
 nt:()=>{const up=[];for(let y=2026+G.season;y<2026+G.season+8;y++)ntComps(y).forEach(c=>up.push(`${y} : ${c.n}`));
  return `<p class="txt">Sélection : <b>${NTM[G.natTeam].f} ${G.natTeam}</b>${G.ntInfo?" · "+G.ntInfo:""}</p>`+compHTML(G.nt,"Pas de tournoi international cette saison.")+`<h3>Prochains tournois</h3><p class="txt">${up.join(" · ")||"—"}</p>`},
 wd:()=>{if(!WDc)WDc=G.club.c;const w=WORLD[WDc];
  let h=`<div class="form"><select onchange="WDc=this.value;renderModal()">${Object.values(WORLD).map(x=>`<option value="${x.id}" ${x.id===WDc?"selected":""}>${x.f} ${x.n}</option>`).join("")}</select><select onchange="WDd=+this.value;renderModal()"><option value="1" ${WDd===1?"selected":""}>${w.d1n}</option><option value="2" ${WDd===2?"selected":""}>${w.d2n}</option></select></div>`;
  const mine=WDc===G.club.c&&WDd===G.lg.d,ts=mine?sortT(G.lg.teams):seededTable(WDc,WDd,G.lg.md,hash(WDc+":"+WDd+":"+G.season));
  return h+`<h3>${w.f} ${WDd===1?w.d1n:w.d2n} · Journée ${G.lg.md}${mine?"":" (classement simulé)"}</h3>`+tblHTML(ts,zoneFn(WDc,WDd,ts.length),G.club.n)},
 fin:()=>`<p class="txt">💶 Trésorerie : <b>${fmt(G.money)}</b> · Patrimoine total : <b>${fmt(netWorth())}</b></p>
  <h3>Investir (résultat à la fin de la saison — certains placements peuvent tout faire perdre)</h3>
  ${INV.map(x=>`<div class="offer"><div><b>${x.n}</b><br><small>${x.d}</small></div><div>${[.1,.25,.5].map(p=>`<button class="btn small" onclick="invest('${x.k}',${p})">${p*100} %</button>`).join("")}</div></div>`).join("")}
  ${G.inv.length?`<p class="mstat">En cours : ${G.inv.map(i=>INV.find(x=>x.k===i.k).n+" "+fmt(i.amt)).join(" · ")}</p>`:""}
  <h3>Dépenser</h3>${SHOP.map(s=>`<div class="offer"><div><b>${s.n}</b><br><small>${fmt(shopCost(s.c))}</small></div><button class="btn small alt" onclick="buy('${s.id}')">Acheter</button></div>`).join("")}
  ${G.assets.length?`<h3>Tes biens</h3><p class="txt">${G.assets.map(a=>`${a.n} (${fmt(a.v)})`).join(" · ")}</p>`:""}`,
 soc:()=>`<p class="txt">📸 Instagram : <b>${fmtK(G.ig)}</b> · 🎵 TikTok : <b>${fmtK(G.tk)}</b> · Image publique : <b>${Math.round(G.img)}/100</b></p>
  <h3>Sponsors & publicités</h3><p class="txt">${G.spons.length?G.spons.map(s=>`${s.b} (${fmt(s.amt)}/an · ${s.yrs} an(s))`).join(" · "):"Aucun contrat pour l'instant : les marques (Nike, Adidas, Puma…) te contactent quand ta réputation augmente."}</p>
  <h3>Publier (actions restantes cette saison : ${G.act})</h3><div class="choices">${SOC.map((a,i)=>`<button class="choice" onclick="doAct('soc',${i})" ${G.act<=0?"disabled":""}>${a.t}</button>`).join("")}</div>`,
 vie:()=>`<p class="txt">💞 ${G.partner?(G.partner==="marié"?"Marié":"En couple")+" · relation "+Math.round(G.couple)+"/100":"Célibataire"} · 👶 ${G.kids} enfant(s)</p><h3>Actions de vie (restantes cette saison : ${G.act})</h3>
  <div class="choices">${ACTS.map((a,i)=>a.c(G)?`<button class="choice" onclick="doAct('vie',${i})" ${G.act<=0?"disabled":""}>${a.t}</button>`:"").join("")}</div>`,
 pal:()=>`<h3>Distinctions</h3><table><tr><td>🥇 Ballon d'Or</td><td>${G.aw.bd}</td></tr><tr><td>👟 Soulier d'Or</td><td>${G.aw.sd}</td></tr><tr><td>⭐ FIFA The Best</td><td>${G.aw.tb}</td></tr><tr><td>🌟 Trophée Kopa (meilleur jeune)</td><td>${G.aw.kopa}</td></tr><tr><td>🏆 Golden Boy</td><td>${G.aw.gb}</td></tr><tr><td>🌱 Meilleur jeune du championnat</td><td>${G.aw.yp}</td></tr><tr><td>🎖️ Hommes du match</td><td>${G.motm}</td></tr><tr><td>Buts / passes décisives en carrière</td><td>${G.cg} / ${G.ca}</td></tr></table>
  <h3>Trophées</h3><table>${Object.entries(G.cab).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")||"<tr><td>Aucun trophée pour l'instant</td><td></td></tr>"}</table>
  <h3>Saisons</h3>${G.hist.slice().reverse().map(x=>`<div class="ln">${x}</div>`).join("")||"<p class='txt'>—</p>"}`,
 mer:()=>`<h3>Mercato mondial</h3>${G.news.length?G.news.map(x=>`<div class="ln">${x}</div>`).join(""):"<p class='txt'>Le mercato des autres clubs a lieu à la fin de chaque saison.</p>"}`
};
function openTab(t){if(t&&t!==MT){MT=t;G.msg=""}$("#modal").hidden=false;document.body.style.overflow="hidden";renderModal()}
function closeModal(){$("#modal").hidden=true;document.body.style.overflow=""}
function renderModal(){
  const md=$("#modal"),sc=md.scrollTop,tabs=[["lg","📊 Championnat"],["cup","🏆 Coupe"],["ct","🌍 Continental"],["nt","🌐 Sélection"],["wd","🗺️ Monde"],["fin","💰 Finances"],["soc","📱 Réseaux"],["vie","💞 Vie privée"],["pal","🏅 Palmarès"],["mer","🔄 Mercato"]];
  md.innerHTML=`<div class="mbox"><div class="mh"><div class="tabs">${tabs.map(([k,l])=>`<button class="tb ${MT===k?"on":""}" onclick="openTab('${k}')">${l}</button>`).join("")}</div><button class="btn small ghost" onclick="closeModal()">✖ Fermer</button></div>${G.msg?`<div class="ln sys">${G.msg}</div>`:""}<div>${TAB[MT]()}</div></div>`;
  md.scrollTop=sc}

/* ================= DÉMARRAGE ================= */
function buildStart(){
  $("#players").innerHTML=PLAYERS.map((p,i)=>`<div class="pcard" onclick="newGame(${i})"><div class="fl">${p.flag}</div><h4>${p.name}</h4><small>${p.nat} · ${p.age} ans</small>
   <div class="pt"><span class="pill">${POS[p.pos]}</span><span class="pill">Niveau ${p.ovr}</span><span class="pill">Potentiel ${p.pot}</span></div><small>${p.bio}</small><small style="margin-top:6px">Débute en ${WORLD[p.cc].d2n} (${WORLD[p.cc].n})</small><small>Sélection : ${p.natTeam||p.nat}</small></div>`).join("");
  $("#cnat").innerHTML=NTS.map(x=>`<option value="${x.n}">${x.f} ${x.n}</option>`).join("");
  let saved=null;try{saved=JSON.parse(localStorage.getItem("fl_save2"))}catch(e){}
  if(saved&&saved.v===2)$("#resume").innerHTML=`<button class="btn alt" onclick="loadGame()">▶ Reprendre : ${saved.name} (Saison ${saved.season})</button>`}
function ccFor(nat){const w=Object.values(WORLD).find(x=>x.n===nat);if(w)return w.id;const k=NTM[nat].k,arr=Object.values(WORLD).filter(x=>x.k===k);return arr.length?pick(arr).id:"FR"}
function createPlayer(){
  const name=($("#cn").value||"Joueur Inconnu").replace(/[<>&"]/g,"").trim()||"Joueur Inconnu",nat=$("#cnat").value;
  startWith({name,nat,natTeam:nat,flag:NTM[nat].f,pos:$("#cpos").value,age:17,ovr:61,pot:ri(86,93),cc:ccFor(nat)})}
function newGame(i){startWith(PLAYERS[i])}
function startWith(P){
  Object.values(WORLD).forEach(w=>w.clubs.forEach(c=>c.l=c.l0));
  const d2=WORLD[P.cc].clubs.filter(c=>c.d===2).sort((a,b)=>b.l-a.l),cl=d2[ri(0,Math.min(3,d2.length-1))];
  G={v:2,name:P.name,nat:P.nat,natTeam:P.natTeam||P.nat,flag:P.flag,pos:P.pos,age:P.age,ovr:P.ovr,pot:P.pot,club:{n:cl.n,l:cl.l,c:cl.c,d:2},
   form:75,rep:12,img:60,coach:60,pres:60,couple:0,fam:70,partner:null,kids:0,secret:0,money:15000,salary:0,season:1,trophies:0,
   aw:{bd:0,sd:0,tb:0,kopa:0,gb:0,yp:0},motm:0,peak:P.ovr,seen:[],queue:[],evs:[],log:[],hist:[],summit:false,offers:[],div:{},off:{},cab:{},cg:0,ca:0,
   cont:null,next:null,sGoals:0,sAssists:0,sTitles:[],sPts:0,lg:null,cup:null,ct:null,nt:null,ntInfo:null,
   ig:12,tk:8,spons:[],assets:[],inv:[],news:[],act:3,msg:"",tmp:null,banned:false,forced:false,auto:false,autoLog:[]};
  G.salary=salaryFor(G.ovr,G.club);
  $("#start").hidden=true;$("#game").hidden=false;
  addLog(`Tu débutes ta carrière à ${G.club.n} (${WORLD[G.club.c].d2n}).`);beginSeason()}
function loadGame(){
  try{G=JSON.parse(localStorage.getItem("fl_save2"))}catch(e){return}
  if(!G||G.v!==2)return;
  Object.values(WORLD).forEach(w=>w.clubs.forEach(c=>{c.l=clamp(Math.round(c.l0+(G.off[c.c+":"+c.n]||0)),30,93)}));
  G.auto=false;G.autoLog=[];
  $("#start").hidden=true;$("#game").hidden=false;addLog("Partie reprise.");render();nextStep()}
buildStart();
</script>
